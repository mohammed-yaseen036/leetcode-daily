const COURSE = [
/* ============ PHASE 1: PYTHON ============ */
{phase:"PHASE 1 — PYTHON FROM ZERO", title:"Course Roadmap", body:`
<p>Welcome! You already understand DSA <i>concepts</i> — this course turns that into <b>practical coding ability</b>. Goal: AI / Software / Full-Stack Engineer.</p>
<h3>The path</h3>
<table><tr><th>Phase</th><th>What you learn</th><th>Outcome</th></tr>
<tr><td>1. Python from zero</td><td>Syntax, data types, functions, OOP, recursion</td><td>You can write any program in Python</td></tr>
<tr><td>2. DSA foundations</td><td>Complexity, arrays, strings, hashing, two pointers</td><td>Solve Easy LeetCode comfortably</td></tr>
<tr><td>3. Core structures</td><td>Stacks, queues, linked lists, trees, heaps, graphs</td><td>Solve Medium LeetCode comfortably</td></tr>
<tr><td>4. Advanced algorithms</td><td>Backtracking, greedy, dynamic programming, tries</td><td>Solve Hard LeetCode + interviews</td></tr>
<tr><td>5. Beyond interviews</td><td>Projects, SQL, system design basics, AI/ML path</td><td>Job-ready portfolio</td></tr></table>
<h3>How to study</h3>
<ul>
<li>One lesson at a time — read, type every example yourself (don't copy-paste!), then do the practice problems.</li>
<li>Your problem files live next to this course: <code class="inline">Topic/Difficulty/slug.txt</code>. The slug IS the URL: leetcode.com/problems/<b>two-sum</b>/</li>
<li>Track everything in <code class="inline">progress_tracker.xlsx</code>.</li>
<li>Aim: 2–3 lessons/day while learning Python, 1–2/day during DSA (slower is fine — depth beats speed).</li>
</ul>
<div class="tip">💡 Mark each lesson done with the green button below. Your progress saves automatically in this browser.</div>`},

{title:"Lesson 1 — Install Python & Write Your First Program", body:`
<p>Python is a language famous for readable code — perfect for learning and the #1 language of AI.</p>
<h3>Setup (5 minutes)</h3>
<ol>
<li>Go to <b>python.org/downloads</b> → install Python 3.12+ (check ✅ "Add Python to PATH" during install!).</li>
<li>Install <b>VS Code</b> (code.visualstudio.com) → open it → Extensions → install "Python".</li>
<li>Create a folder <code class="inline">python-practice</code>, open it in VS Code, make a file <code class="inline">day1.py</code>.</li>
</ol>
<pre><span class="c"># day1.py — your first program</span>
<span class="k">print</span>(<span class="s">"Hello, world!"</span>)
<span class="k">print</span>(<span class="s">"I am learning Python"</span>)</pre>
<p>Run it: open VS Code terminal (Ctrl+`) and type <code class="inline">python day1.py</code></p>
<h3>Python as a calculator</h3>
<pre><span class="k">print</span>(<span class="n">2</span> + <span class="n">3</span>)      <span class="c"># 5   addition</span>
<span class="k">print</span>(<span class="n">10</span> - <span class="n">4</span>)     <span class="c"># 6   subtraction</span>
<span class="k">print</span>(<span class="n">6</span> * <span class="n">7</span>)      <span class="c"># 42  multiplication</span>
<span class="k">print</span>(<span class="n">7</span> / <span class="n">2</span>)      <span class="c"># 3.5 division (always float)</span>
<span class="k">print</span>(<span class="n">7</span> // <span class="n">2</span>)     <span class="c"># 3   floor division (drops decimal)</span>
<span class="k">print</span>(<span class="n">7</span> % <span class="n">2</span>)      <span class="c"># 1   modulo (remainder) — used A LOT in DSA!</span>
<span class="k">print</span>(<span class="n">2</span> ** <span class="n">10</span>)    <span class="c"># 1024 power</span></pre>
<div class="tip">💡 <code class="inline">% </code>(remainder) and <code class="inline">//</code> show up everywhere in interview problems — even/odd checks, digit manipulation, circular arrays.</div>
<h3>Comments</h3>
<p><code class="inline">#</code> starts a comment — Python ignores it. Use comments to explain <i>why</i>, not what.</p>
<div class="practice"><b>🎯 Practice:</b> No LeetCode yet. Write day1.py that prints your name, does all 7 math operations on numbers you pick, and has at least 3 comments. Run it until it works with no errors.</div>`},

{title:"Lesson 2 — Variables & Data Types", body:`
<p>A variable is a labeled box that stores a value. Python figures out the type automatically.</p>
<pre>name = <span class="s">"Smyas"</span>       <span class="c"># str  (text)</span>
age = <span class="n">21</span>             <span class="c"># int  (whole number)</span>
height = <span class="n">5.9</span>         <span class="c"># float (decimal)</span>
is_student = <span class="k">True</span>    <span class="c"># bool (True/False)</span>
nothing = <span class="k">None</span>       <span class="c"># NoneType ("no value")</span>

<span class="k">print</span>(<span class="k">type</span>(name))    <span class="c"># &lt;class 'str'&gt;</span>
<span class="k">print</span>(<span class="k">type</span>(age))     <span class="c"># &lt;class 'int'&gt;</span></pre>
<h3>Naming rules & style</h3>
<ul><li>Use <code class="inline">snake_case</code>: <code class="inline">total_sum</code>, <code class="inline">max_count</code></li>
<li>Can't start with a number; case-sensitive (<code class="inline">Age ≠ age</code>)</li></ul>
<h3>Type conversion</h3>
<pre>age_str = <span class="s">"21"</span>
age = <span class="k">int</span>(age_str) + <span class="n">1</span>        <span class="c"># 22 — string → int</span>
label = <span class="s">"Score: "</span> + <span class="k">str</span>(<span class="n">99</span>)  <span class="c"># int → string to join with text</span>
pi_int = <span class="k">int</span>(<span class="n">3.99</span>)            <span class="c"># 3 — int() TRUNCATES, doesn't round!</span></pre>
<h3>f-strings (modern formatting)</h3>
<pre>score = <span class="n">95</span>
<span class="k">print</span>(<span class="s">f"You scored {score} points!"</span>)   <span class="c"># put ANY expression inside {}</span>
<span class="k">print</span>(<span class="s">f"Doubled: {score * 2}"</span>)</pre>
<div class="warn">⚠️ Classic bug: <code class="inline">input()</code> always gives a <b>string</b>. Convert it: <code class="inline">age = int(input())</code></div>
<div class="practice"><b>🎯 Practice:</b> Make <code class="inline">day2.py</code>: store your name/age/city in variables, print a sentence with f-strings, swap two variables (<code class="inline">a, b = b, a</code> — Python's superpower), and check <code class="inline">type()</code> of each variable.</div>`},

{title:"Lesson 3 — Strings Deep Dive", body:`
<p>Strings are sequences of characters — and the source of tons of interview questions.</p>
<pre>s = <span class="s">"hello python"</span>
<span class="k">print</span>(<span class="k">len</span>(s))        <span class="c"># 12 — length</span>
<span class="k">print</span>(s[<span class="n">0</span>])          <span class="c"># 'h'  — indexing starts at 0</span>
<span class="k">print</span>(s[-<span class="n">1</span>])         <span class="c"># 'n'  — negative index = from the end</span>
<span class="k">print</span>(s[<span class="n">0</span>:<span class="n">5</span>])        <span class="c"># 'hello' — slicing [start:end] (end excluded!)</span>
<span class="k">print</span>(s[<span class="n">6</span>:])         <span class="c"># 'python'</span>
<span class="k">print</span>(s[::-<span class="n">1</span>])       <span class="c"># reverse the whole string — MEMORIZE THIS</span></pre>
<h3>Strings are immutable</h3>
<pre>s[<span class="n">0</span>] = <span class="s">"H"</span>           <span class="c"># ❌ TypeError! Can't change a character</span>
s = <span class="s">"H"</span> + s[<span class="n">1</span>:]     <span class="c"># ✅ make a new string instead</span></pre>
<div class="warn">⚠️ Building strings with <code class="inline">+</code> in a loop is slow (O(n²)). Collect parts in a list and <code class="inline">"".join(parts)</code> at the end — interviewers notice this.</div>
<h3>Essential methods (know all of these cold)</h3>
<pre>s = <span class="s">"  Hello World  "</span>
s.strip()              <span class="c"># "Hello World"  — remove edge spaces</span>
s.lower(); s.upper()   <span class="c"># case change</span>
s.split()              <span class="c"># ["Hello","World"] — split into list</span>
<span class="s">"-"</span>.join([<span class="s">"a"</span>,<span class="s">"b"</span>])   <span class="c"># "a-b"</span>
s.replace(<span class="s">"l"</span>,<span class="s">"L"</span>)    <span class="c"># replace all occurrences</span>
s.count(<span class="s">"l"</span>)           <span class="c"># count occurrences</span>
s.find(<span class="s">"World"</span>)        <span class="c"># index or -1 if missing</span>
s.startswith(<span class="s">"He"</span>)     <span class="c"># True / endswith()</span>
<span class="s">"abc123"</span>.isdigit()     <span class="c"># False / isalpha(), isalnum()</span></pre>
<div class="practice"><b>🎯 Practice:</b> Write functions (just top-level code for now): count vowels in a word, check if a string reads the same reversed (palindrome), reverse words in a sentence.<br><b>LeetCode (Easy):</b> <code class="inline">reverse-string</code>, <code class="inline">valid-palindrome</code>, <code class="inline">length-of-last-word</code> — find them in your <b>String/Easy</b> folder. It's OK if they're hard now — try, look at solutions, re-try.</div>`},

{title:"Lesson 4 — Lists (Python's Array)", body:`
<p>A list is an ordered, changeable collection — the workhorse of Python and 90% of easy DSA problems.</p>
<pre>nums = [<span class="n">10</span>, <span class="n">20</span>, <span class="n">30</span>, <span class="n">40</span>]
nums[<span class="n">0</span>]            <span class="c"># 10 — index</span>
nums[-<span class="n">1</span>]           <span class="c"># 40 — last element</span>
nums.append(<span class="n">50</span>)    <span class="c"># add to end → [10,20,30,40,50]</span>
nums.insert(<span class="n">0</span>, <span class="n">5</span>)  <span class="c"># insert at index 0</span>
nums.pop()         <span class="c"># remove &amp; return last</span>
nums.remove(<span class="n">20</span>)    <span class="c"># remove by value (first match)</span>
<span class="k">len</span>(nums); <span class="k">sum</span>(nums); <span class="k">max</span>(nums); <span class="k">min</span>(nums)
nums.sort()                    <span class="c"># sorts IN PLACE, ascending</span>
nums.sort(reverse=<span class="k">True</span>)       <span class="c"># descending</span>
sorted(nums)                   <span class="c"># returns NEW sorted list</span>
nums.reverse()
<span class="n">5</span> <span class="k">in</span> nums                      <span class="c"># membership check → True/False</span></pre>
<h3>Slicing (same as strings)</h3>
<pre>a = [<span class="n">1</span>,<span class="n">2</span>,<span class="n">3</span>,<span class="n">4</span>,<span class="n">5</span>]
a[<span class="n">1</span>:<span class="n">4</span>]    <span class="c"># [2,3,4]</span>
a[::<span class="n">2</span>]    <span class="c"># [1,3,5] — every 2nd</span>
a[::-<span class="n">1</span>]   <span class="c"># reversed copy</span>
b = a[:]   <span class="c"># SHALLOW COPY — crucial!</span></pre>
<div class="warn">⚠️ <code class="inline">b = a</code> does NOT copy — both names point to the same list! Change one, both change. Use <code class="inline">b = a[:]</code> or <code class="inline">list(a)</code>.</div>
<h3>Nested lists (2D grids — think matrices)</h3>
<pre>grid = [[<span class="n">1</span>,<span class="n">2</span>,<span class="n">3</span>],
        [<span class="n">4</span>,<span class="n">5</span>,<span class="n">6</span>]]
grid[<span class="n">1</span>][<span class="n">2</span>]   <span class="c"># 6 — row 1, col 2</span>
rows = [[<span class="n">0</span>]*<span class="n">3</span> <span class="k">for</span> _ <span class="k">in</span> <span class="k">range</span>(<span class="n">2</span>)]  <span class="c"># correct way to init 2D</span></pre>
<div class="warn">⚠️ NEVER <code class="inline">[[0]*3]*2</code> — all rows are the SAME row. This bug haunts everyone once.</div>
<div class="practice"><b>🎯 Practice:</b> Sum a list without <code class="inline">sum()</code>; find max without <code class="inline">max()</code>; reverse without slicing.<br><b>LeetCode (Easy):</b> <code class="inline">remove-duplicates-from-sorted-array</code>, <code class="inline">plus-one</code>, <code class="inline">move-zeroes</code> — from <b>Array/Easy</b>.</div>`},

{title:"Lesson 5 — Loops & Range", body:`
<p>Loops repeat work — the engine of every algorithm.</p>
<h3>for loops (iterate over things)</h3>
<pre><span class="k">for</span> num <span class="k">in</span> [<span class="n">10</span>, <span class="n">20</span>, <span class="n">30</span>]:
    <span class="k">print</span>(num)

<span class="k">for</span> i <span class="k">in</span> <span class="k">range</span>(<span class="n">5</span>):        <span class="c"># 0,1,2,3,4</span>
<span class="k">for</span> i <span class="k">in</span> <span class="k">range</span>(<span class="n">2</span>, <span class="n">10</span>, <span class="n">2</span>): <span class="c"># 2,4,6,8 — start,stop,step</span>

<span class="c"># need index AND value?</span>
<span class="k">for</span> i, ch <span class="k">in</span> <span class="k">enumerate</span>(<span class="s">"abc"</span>):
    <span class="k">print</span>(i, ch)           <span class="c"># 0 a / 1 b / 2 c</span></pre>
<h3>while loops (repeat until condition fails)</h3>
<pre>count = <span class="n">0</span>
<span class="k">while</span> count &lt; <span class="n">3</span>:
    <span class="k">print</span>(count)
    count += <span class="n">1</span>            <span class="c"># forget this = infinite loop!</span></pre>
<h3>break / continue</h3>
<pre><span class="k">for</span> n <span class="k">in</span> <span class="k">range</span>(<span class="n">10</span>):
    <span class="k">if</span> n == <span class="n">3</span>: <span class="k">continue</span>   <span class="c"># skip rest of THIS iteration</span>
    <span class="k">if</span> n == <span class="n">7</span>: <span class="k">break</span>      <span class="c"># exit loop entirely</span>
    <span class="k">print</span>(n)               <span class="c"># 0 1 2 4 5 6</span></pre>
<h3>Nested loops</h3>
<pre><span class="c"># print every pair — foundation of brute force solutions</span>
<span class="k">for</span> i <span class="k">in</span> <span class="k">range</span>(<span class="n">3</span>):
    <span class="k">for</span> j <span class="k">in</span> <span class="k">range</span>(<span class="n">3</span>):
        <span class="k">print</span>(i, j)   <span class="c"># runs 9 times</span></pre>
<div class="tip">💡 Two Sum's brute force is just nested loops checking every pair. Later you'll replace the inner loop with a hash map — that's the classic O(n²)→O(n) upgrade.</div>
<div class="practice"><b>🎯 Practice:</b> FizzBuzz 1–100 (divisible by 3→"Fizz", 5→"Buzz", both→"FizzBuzz"); multiplication table; sum only even numbers in a list.<br><b>LeetCode (Easy):</b> <code class="inline">fizz-buzz</code>, <code class="inline">two-sum</code> ⭐(the most famous problem ever — do it brute force first!) — from <b>Array/Easy</b> or <b>Hash Table/Easy</b>.</div>`},

{title:"Lesson 6 — Conditions & Logic", body:`
<pre>temp = <span class="n">35</span>
<span class="k">if</span> temp &gt; <span class="n">30</span>:
    <span class="k">print</span>(<span class="s">"hot"</span>)
<span class="k">elif</span> temp &gt; <span class="n">20</span>:
    <span class="k">print</span>(<span class="s">"nice"</span>)
<span class="k">else</span>:
    <span class="k">print</span>(<span class="s">"cold"</span>)</pre>
<h3>Comparison & logical operators</h3>
<pre>==  !=  &lt;  &gt;  &lt;=  &gt;=
<span class="k">and</span>  <span class="k">or</span>  <span class="k">not</span>
x = <span class="n">7</span>
<span class="k">if</span> x &gt; <span class="n">0</span> <span class="k">and</span> x % <span class="n">2</span> == <span class="n">0</span>: <span class="k">print</span>(<span class="s">"positive even"</span>)</pre>
<h3>Truthiness — huge in Python interviews</h3>
<pre><span class="c"># these are all "falsy": 0, "", [], {}, set(), None, False</span>
items = []
<span class="k">if</span> <span class="k">not</span> items:          <span class="c"># pythonic empty check</span>
    <span class="k">print</span>(<span class="s">"empty!"</span>)</pre>
<h3>Ternary (one-line if)</h3>
<pre>parity = <span class="s">"even"</span> <span class="k">if</span> x % <span class="n">2</span> == <span class="n">0</span> <span class="k">else</span> <span class="s">"odd"</span></pre>
<h3>Chained & identity comparison</h3>
<pre><span class="k">if</span> <span class="n">0</span> &lt;= x &lt;= <span class="n">10</span>: ...   <span class="c"># Python allows math-style chains!</span>
a <span class="k">is</span> b                 <span class="c"># same OBJECT (use == for values)</span></pre>
<div class="practice"><b>🎯 Practice:</b> Grade calculator (90+→A etc.); leap year checker ((%4==0 and %100!=0) or %400==0); find largest of three numbers WITHOUT max().<br><b>LeetCode (Easy):</b> <code class="inline">lemonade-change</code>, <code class="inline">valid-parentheses</code> (needs stacks later — attempt anyway).</div>`},

{title:"Lesson 7 — Functions", body:`
<p>Functions package reusable logic. Every LeetCode solution is a function — master these now.</p>
<pre><span class="k">def</span> greet(name):
    <span class="s">"""Say hello."""</span>          <span class="c"># docstring</span>
    <span class="k">return</span> <span class="s">f"Hello, {name}!"</span>

result = greet(<span class="s">"Smyas"</span>)</pre>
<h3>Parameters</h3>
<pre><span class="k">def</span> power(base, exp=<span class="n">2</span>):      <span class="c"># default value</span>
    <span class="k">return</span> base ** exp
power(<span class="n">5</span>)            <span class="c"># 25 (uses default)</span>
power(exp=<span class="n">3</span>, base=<span class="n">2</span>) <span class="c"># 8 (keyword args, order-free)</span>

<span class="k">def</span> total(*args):            <span class="c"># any number of positional args</span>
    <span class="k">return</span> <span class="k">sum</span>(args)

<span class="k">def</span> info(**kwargs):          <span class="c"># any number of keyword args</span>
    <span class="k">print</span>(kwargs)</pre>
<h3>Return multiple values</h3>
<pre><span class="k">def</span> min_max(nums):
    <span class="k">return</span> <span class="k">min</span>(nums), <span class="k">max</span>(nums)
lo, hi = min_max([<span class="n">3</span>,<span class="n">1</span>,<span class="n">4</span>])   <span class="c"># tuple unpacking!</span></pre>
<h3>Scope</h3>
<pre>x = <span class="n">10</span>                 <span class="c"># global</span>
<span class="k">def</span> f():
    y = <span class="n">5</span>              <span class="c"># local — dies when function ends</span>
    <span class="k">return</span> x + y       <span class="c"># reading globals is fine</span></pre>
<div class="tip">💡 Functions should do ONE thing. If you can't name it simply, split it.</div>
<div class="practice"><b>🎯 Practice:</b> Rewrite Lessons 3–6 exercises as functions: <code class="inline">count_vowels(s) → int</code>, <code class="inline">is_palindrome(s) → bool</code>, <code class="inline">second_largest(nums) → int</code>, <code class="inline">is_prime(n) → bool</code>.<br><b>LeetCode (Easy):</b> <code class="inline">palindrome-number</code>, <code class="inline">roman-to-integer</code> — from <b>Math/Easy</b>.</div>`},

{title:"Lesson 8 — Dictionaries & Sets (Hashing!)", body:`
<p>Dictionaries store key→value pairs; sets store unique items. Together they are THE most important tools for LeetCode — "Hash Table" is tagged on 800+ problems.</p>
<pre>ages = {<span class="s">"ana"</span>: <span class="n">25</span>, <span class="s">"bo"</span>: <span class="n">31</span>}
ages[<span class="s">"ana"</span>]               <span class="c"># 25 — lookup</span>
ages[<span class="s">"cy"</span>] = <span class="n">19</span>           <span class="c"># add/update</span>
ages.get(<span class="s">"zz"</span>, <span class="n">-1</span>)        <span class="c"># -1 if missing (no crash)</span>
<span class="k">del</span> ages[<span class="s">"bo"</span>]
<span class="s">"ana"</span> <span class="k">in</span> ages             <span class="c"># True — O(1) check!</span>

<span class="k">for</span> key <span class="k">in</span> ages: ...
<span class="k">for</span> key, val <span class="k">in</span> ages.items(): ...</pre>
<h3>⭐ The counting pattern (memorize forever)</h3>
<pre><span class="k">def</span> char_count(s):
    counts = {}
    <span class="k">for</span> ch <span class="k">in</span> s:
        counts[ch] = counts.get(ch, <span class="n">0</span>) + <span class="n">1</span>
    <span class="k">return</span> counts

char_count(<span class="s">"banana"</span>)   <span class="c"># {'b':1,'a':3,'n':2}</span></pre>
<p>This exact pattern solves anagram, majority-element, frequency problems... dozens of them.</p>
<h3>Sets</h3>
<pre>s = {<span class="n">1</span>, <span class="n">2</span>, <span class="n">3</span>}
s.add(<span class="n">4</span>); s.discard(<span class="n">2</span>)
<span class="n">3</span> <span class="k">in</span> s                  <span class="c"># O(1) — vs O(n) for lists!</span>
seen = set(nums)          <span class="c"># dedupe a list instantly</span></pre>
<h3>DefaultDict & Counter (standard library shortcuts)</h3>
<pre><span class="k">from</span> collections <span class="k">import</span> defaultdict, Counter
d = defaultdict(<span class="k">int</span>)     <span class="c"># missing keys auto-start at 0</span>
Counter(<span class="s">"banana"</span>).most_common(<span class="n">1</span>)  <span class="c"># [('a', 3)]</span></pre>
<div class="tip">💡 Mental model: list = search O(n). dict/set = search O(1). When a problem feels slow, ask "can I trade memory for speed with a dict?" — that instinct IS hashing.</div>
<div class="practice"><b>🎯 Practice:</b> Count word frequencies in a paragraph; find first non-repeating character.<br><b>LeetCode (Easy):</b> <code class="inline">contains-duplicate</code>, <code class="inline">valid-anagram</code>, <code class="inline">intersection-of-two-arrays</code>, <code class="inline">majority-element</code> — from <b>Hash Table/Easy</b>. These four patterns recur constantly.</div>`},

{title:"Lesson 9 — Tuples & Comprehensions", body:`
<h3>Tuples — immutable lists</h3>
<pre>point = (<span class="n">3</span>, <span class="n">5</span>)
x, y = point              <span class="c"># unpacking</span>
<span class="c"># tuples can be dict keys; lists cannot</span></pre>
<h3>List comprehensions — Python's signature move</h3>
<pre>squares = [x*x <span class="k">for</span> x <span class="k">in</span> <span class="k">range</span>(<span class="n">10</span>)]
evens    = [x <span class="k">for</span> x <span class="k">in</span> nums <span class="k">if</span> x % <span class="n">2</span> == <span class="n">0</span>]
matrix_t = [[row[i] <span class="k">for</span> row <span class="k">in</span> matrix] <span class="k">for</span> i <span class="k">in</span> <span class="k">range</span>(<span class="n">3</span>)]  <span class="c"># transpose</span></pre>
<p>Read it as: "[expression for item in collection if condition]"</p>
<h3>Dict & set comprehensions</h3>
<pre>lengths = {w: <span class="k">len</span>(w) <span class="k">for</span> w <span class="k">in</span> words}
unique  = {x % <span class="n">10</span> <span class="k">for</span> x <span class="k">in</span> nums}</pre>
<h3>zip — walk two lists together</h3>
<pre><span class="k">for</span> name, score <span class="k">in</span> <span class="k">zip</span>(names, scores): ...
pairs = <span class="k">dict</span>(<span class="k">zip</span>(keys, values))</pre>
<div class="practice"><b>🎯 Practice:</b> Convert Lesson 8's counting loop to comprehension style; flatten a 2D list in one line: <code class="inline">[x for row in grid for x in row]</code>.<br><b>LeetCode (Easy):</b> <code class="inline">transpose-matrix</code>, <code class="inline">richest-customer-wealth</code> — from <b>Matrix/Easy</b> and <b>Array/Easy</b>.</div>`},

{title:"Lesson 10 — Error Handling & Files", body:`
<h3>try / except — handle crashes gracefully</h3>
<pre><span class="k">try</span>:
    n = <span class="k">int</span>(input(<span class="s">"number: "</span>))
    result = <span class="n">10</span> / n
<span class="k">except</span> ValueError:
    <span class="k">print</span>(<span class="s">"that wasn't a number"</span>)
<span class="k">except</span> ZeroDivisionError:
    <span class="k">print</span>(<span class="s">"can't divide by zero"</span>)
<span class="k">finally</span>:
    <span class="k">print</span>(<span class="s">"always runs"</span>)</pre>
<h3>Raising your own errors</h3>
<pre><span class="k">def</span> divide(a, b):
    <span class="k">if</span> b == <span class="n">0</span>:
        <span class="k">raise</span> ValueError(<span class="s">"b must not be 0"</span>)
    <span class="k">return</span> a / b</pre>
<h3>Files</h3>
<pre><span class="k">with</span> <span class="k">open</span>(<span class="s">"notes.txt"</span>, <span class="s">"w"</span>) <span class="k">as</span> f:   <span class="c"># 'with' auto-closes!</span>
    f.write(<span class="s">"hello\n"</span>)

<span class="k">with</span> <span class="k">open</span>(<span class="s">"notes.txt"</span>) <span class="k">as</span> f:
    <span class="k">for</span> line <span class="k">in</span> f:
        <span class="k">print</span>(line.strip())</pre>
<div class="practice"><b>🎯 Practice:</b> Wrap your prime-checker so bad input doesn't crash it. Save 10 numbers to a file, read them back and print their sum.</div>`},

{title:"Lesson 11 — Recursion (Concept → Code)", body:`
<p>You know recursion conceptually. Now make it concrete: a function that calls itself on a SMALLER input, stopping at a BASE CASE.</p>
<pre><span class="k">def</span> factorial(n):
    <span class="k">if</span> n &lt;= <span class="n">1</span>:            <span class="c"># 1. base case — stops recursion</span>
        <span class="k">return</span> <span class="n">1</span>
    <span class="k">return</span> n * factorial(n - <span class="n">1</span>)  <span class="c"># 2. recursive call, smaller n</span></pre>
<h3>Trace it by hand (do this on paper!)</h3>
<pre>factorial(4)
= 4 * factorial(3)
= 4 * (3 * factorial(2))
= 4 * (3 * (2 * factorial(1)))
= 4 * (3 * (2 * 1))
= 24</pre>
<h3>Fibonacci — the classic</h3>
<pre><span class="k">def</span> fib(n):
    <span class="k">if</span> n &lt;= <span class="n">1</span>: <span class="k">return</span> n
    <span class="k">return</span> fib(n-<span class="n">1</span>) + fib(n-<span class="n">2</span>)</pre>
<div class="warn">⚠️ This fib recomputes the same values repeatedly — O(2ⁿ). Fix it by remembering results (memoization) with <code class="inline">@functools.lru_cache</code> above the def → becomes O(n). That trick IS dynamic programming's core idea — remember this feeling when we reach DP.</div>
<h3>Recursion checklist</h3>
<ol><li>Base case first (or infinite descent)</li><li>Each call must move toward the base case</li><li>Trust the recursion — assume the smaller call works</li></ol>
<div class="practice"><b>🎯 Practice:</b> Recursive sum of a list; recursive power(a,b); reverse a string recursively.<br><b>LeetCode (Easy):</b> <code class="inline">fibonacci-number</code>, <code class="inline">power-of-two</code> (recursively) — from <b>Math/Easy</b>, <b>Recursion/Easy</b>.</div>`},

{title:"Lesson 12 — Classes & OOP", body:`
<p>OOP bundles data + behavior into objects. Interviews test basic OOP design; frameworks/AI libraries are built entirely from classes.</p>
<pre><span class="k">class</span> Stack:
    <span class="k">def</span> __init__(self):          <span class="c"># constructor</span>
        self.items = []          <span class="c"># instance data</span>

    <span class="k">def</span> push(self, x):           <span class="c"># method — note self!</span>
        self.items.append(x)

    <span class="k">def</span> pop(self):
        <span class="k">return</span> self.items.pop()

    <span class="k">def</span> is_empty(self):
        <span class="k">return</span> <span class="k">len</span>(self.items) == <span class="n">0</span>

s = Stack()      <span class="c"># create object — no 'new' needed</span>
s.push(<span class="n">1</span>); s.push(<span class="n">2</span>)
<span class="k">print</span>(s.pop())   <span class="c"># 2</span></pre>
<h3>Inheritance</h3>
<pre><span class="k">class</span> Animal:
    <span class="k">def</span> __init__(self, name): self.name = name
    <span class="k">def</span> speak(self): <span class="k">return</span> <span class="s">"..."</span>

<span class="k">class</span> Dog(Animal):                <span class="c"># Dog IS-A Animal</span>
    <span class="k">def</span> speak(self):              <span class="c"># override</span>
        <span class="k">return</span> <span class="s">f"{self.name}: woof"</span></pre>
<h3>Magic methods (dunder)</h3>
<pre><span class="k">class</span> Vector:
    <span class="k">def</span> __init__(self, x, y): self.x, self.y = x, y
    <span class="k">def</span> __add__(self, other): <span class="k">return</span> Vector(self.x+other.x, self.y+other.y)
    <span class="k">def</span> __repr__(self):       <span class="k">return</span> <span class="s">f"Vector({self.x},{self.y})"</span></pre>
<div class="tip">💡 LeetCode's Design problems (Min Stack, LRU Cache...) are literally "build this class." Your OOP skill converts directly.</div>
<div class="practice"><b>🎯 Practice:</b> Build a <code class="inline">BankAccount</code> class (deposit, withdraw, balance check, can't overdraw). Then implement <code class="inline">min-stack</code> (Easy, Design folder) after peeking at its approach.</div>`},

/* ============ PHASE 2: DSA FOUNDATIONS ============ */
{phase:"PHASE 2 — DSA FOUNDATIONS", title:"Lesson 13 — Big-O Complexity in Practice", body:`
<p>You know the theory; here's how to <i>feel</i> it in Python.</p>
<pre><span class="c"># O(1) — constant: dict/set lookup, list index</span>
d[key], arr[<span class="n">0</span>]

<span class="c"># O(log n) — halving: binary search</span>
<span class="k">while</span> n &gt; <span class="n">1</span>: n //= <span class="n">2</span>

<span class="c"># O(n) — touch each element once</span>
<span class="k">for</span> x <span class="k">in</span> arr: ...

<span class="c"># O(n log n) — sorting, heap ops</span>
arr.sort()

<span class="c"># O(n²) — nested loops over same data</span>
<span class="k">for</span> a <span class="k">in</span> arr: <span class="k">for</span> b <span class="k">in</span> arr: ...

<span class="c"># O(2ⁿ) — trying all subsets (naive recursion)</span></pre>
<h3>Budget cheat sheet (n = input size)</h3>
<table><tr><th>n up to</th><th>Acceptable complexity</th></tr>
<tr><td>~12</td><td>O(n!)</td></tr><tr><td>~25</td><td>O(2ⁿ)</td></tr><tr><td>~5000</td><td>O(n²)</td></tr>
<tr><td>~10⁵–10⁶</td><td>O(n log n) or O(n)</td></tr><tr><td>&gt;10⁸</td><td>O(log n) / O(1) math</td></tr></table>
<h3>Hiding constants: Python-specific speedups</h3>
<pre><span class="c"># SLOW O(n) loop:</span>
total = <span class="n">0</span>
<span class="k">for</span> x <span class="k">in</span> nums: total += x
<span class="c"># FAST (C-speed builtin, same Big-O but 10x faster):</span>
total = <span class="k">sum</span>(nums)</pre>
<div class="tip">💡 Interview answer format: "Time O(n log n) due to sort, space O(n) for the new array." Always give time AND space, and say WHY.</div>
<div class="practice"><b>🎯 Practice:</b> For each solution you wrote in Lessons 3–12, state its time & space out loud. Re-solve <code class="inline">two-sum</code>: nested loops O(n²), then dict O(n). Time both with <code class="inline">time.perf_counter()</code> on a 100k list.</div>`},

{title:"Lesson 14 — Arrays: Patterns That Repeat", body:`
<p>Arrays are 2200+ LeetCode problems, but only ~8 patterns cover almost all of them. Learn patterns, not problems.</p>
<h3>Pattern 1: Running max/min/count</h3>
<pre>best = cur = <span class="n">0</span>
<span class="k">for</span> x <span class="k">in</span> nums:
    cur = <span class="k">max</span>(cur, cur + x)   <span class="c"># Kadane's — max subarray!</span>
    best = <span class="k">max</span>(best, cur)</pre>
<h3>Pattern 2: Prefix sums (range queries in O(1))</h3>
<pre>prefix = [<span class="n">0</span>]
<span class="k">for</span> x <span class="k">in</span> nums: prefix.append(prefix[-<span class="n">1</span>] + x)
<span class="c"># sum of nums[i:j] = prefix[j] - prefix[i]</span></pre>
<h3>Pattern 3: In-place overwrite (write pointer)</h3>
<pre><span class="c"># remove duplicates from sorted array</span>
write = <span class="n">1</span>
<span class="k">for</span> read <span class="k">in</span> <span class="k">range</span>(<span class="n">1</span>, <span class="k">len</span>(nums)):
    <span class="k">if</span> nums[read] != nums[read-<span class="n">1</span>]:
        nums[write] = nums[read]; write += <span class="n">1</span></pre>
<h3>Pattern 4: Rotate with reversal trick</h3>
<pre><span class="c"># rotate right by k: reverse all, reverse 0..k, reverse k..end</span></pre>
<div class="practice"><b>🎯 Practice:</b> <code class="inline">max-subarray</code>, <code class="inline">rotate-array</code>, <code class="inline">best-time-to-buy-and-sell-stock</code> (Easy, Array). After solving, tag which pattern each used.</div>`},

{title:"Lesson 15 — Two Pointers & Sliding Window", body:`
<h3>Opposite-direction pointers (sorted arrays)</h3>
<pre><span class="c"># pair with target sum in sorted array — O(n)</span>
l, r = <span class="n">0</span>, <span class="k">len</span>(nums) - <span class="n">1</span>
<span class="k">while</span> l &lt; r:
    s = nums[l] + nums[r]
    <span class="k">if</span> s == target: <span class="k">return</span> [l, r]
    <span class="k">elif</span> s &lt; target: l += <span class="n">1</span>   <span class="c"># need bigger</span>
    <span class="k">else</span>: r -= <span class="n">1</span>              <span class="c"># need smaller</span></pre>
<h3>Same-direction (slow/fast)</h3>
<pre><span class="c"># remove element in place</span>
slow = <span class="n">0</span>
<span class="k">for</span> fast <span class="k">in</span> <span class="k">range</span>(<span class="k">len</span>(nums)):
    <span class="k">if</span> nums[fast] != val:
        nums[slow] = nums[fast]; slow += <span class="n">1</span></pre>
<h3>Sliding window — subarray problems in O(n)</h3>
<pre><span class="c"># longest substring without repeating chars (the classic)</span>
seen = set(); left = best = <span class="n">0</span>
<span class="k">for</span> right <span class="k">in</span> <span class="k">range</span>(<span class="k">len</span>(s)):
    <span class="k">while</span> s[right] <span class="k">in</span> seen:      <span class="c"># shrink until valid</span>
        seen.discard(s[left]); left += <span class="n">1</span>
    seen.add(s[right])
    best = <span class="k">max</span>(best, right - left + <span class="n">1</span>)</pre>
<div class="tip">💡 Trigger phrase: "longest/shortest subarray/substring satisfying X" → sliding window. Window grows right; shrinks left while invalid. Each element enters/leaves once → O(n).</div>
<div class="practice"><b>🎯 Practice:</b> <code class="inline">two-sum-ii-input-array-is-sorted</code>, <code class="inline">valid-palindrome</code> (redone with pointers!), <code class="inline">longest-substring-without-repeating-characters</code> (Medium ⭐), <code class="inline">minimum-size-subarray-sum</code> (Medium).</div>`},

{title:"Lesson 16 — Binary Search (and thinking in halves)", body:`
<pre><span class="k">def</span> binary_search(nums, target):
    lo, hi = <span class="n">0</span>, <span class="k">len</span>(nums) - <span class="n">1</span>
    <span class="k">while</span> lo &lt;= hi:
        mid = (lo + hi) // <span class="n">2</span>
        <span class="k">if</span> nums[mid] == target: <span class="k">return</span> mid
        <span class="k">elif</span> nums[mid] &lt; target: lo = mid + <span class="n">1</span>
        <span class="k">else</span>: hi = mid - <span class="n">1</span>
    <span class="k">return</span> -<span class="n">1</span></pre>
<h3>Boundary variant (find FIRST true — most useful form)</h3>
<pre><span class="c"># first index where condition becomes true</span>
lo, hi = <span class="n">0</span>, <span class="k">len</span>(nums)          <span class="c"># note: hi inclusive-exclusive style</span>
<span class="k">while</span> lo &lt; hi:
    mid = (lo + hi) // <span class="n">2</span>
    <span class="k">if</span> condition(nums[mid]): hi = mid      <span class="c"># keep mid, go left</span>
    <span class="k">else</span>: lo = mid + <span class="n">1</span>
<span class="c"># lo is the boundary</span></pre>
<div class="warn">⚠️ Off-by-one hell ends with discipline: define what lo/hi MEAN ("answer could be anywhere in [lo,hi]"), keep the meaning true every iteration, and the loop condition writes itself.</div>
<div class="tip">💡 Secret weapon: binary search works on ANY monotonic thing — sorted arrays, but also "minimum capacity to ship in D days", "square root", "kth smallest". If you can phrase a yes/no question whose answers are FFFFTTTT, binary-search the boundary.</div>
<div class="practice"><b>🎯 Practice:</b> <code class="inline">binary-search</code>, <code class="inline">search-insert-position</code>, <code class="inline">first-bad-version</code>, <code class="inline">sqrt(x)</code> (Medium, binary search on answer!). From <b>Binary Search</b> folders.</div>`},

{title:"Lesson 17 — Sorting & Custom Keys", body:`
<p>In interviews you never implement quicksort from scratch in Python — you master <code class="inline">sort</code>'s custom keys instead.</p>
<pre>words.sort(key=<span class="k">len</span>)                       <span class="c"># by length</span>
people.sort(key=<span class="k">lambda</span> p: p[<span class="n">1</span>])           <span class="c"># by 2nd tuple item</span>
data.sort(key=<span class="k">lambda</span> x: (-x.score, x.name)) <span class="c"># multi-key: desc score, asc name</span>
nums.sort(key=<span class="k">abs</span>)                        <span class="c"># by absolute value</span></pre>
<h3>Sort-of-the-day facts interviewers love</h3>
<ul>
<li>Python uses <b>Timsort</b>: merge sort + insertion hybrid, stable (equal keys keep order), O(n log n) worst, O(n) on nearly-sorted.</li>
<li>"Stable" matters: sort by secondary key first, primary key second → correct multi-level ordering.</li>
<li><code class="inline">sorted(iterable)</code> returns new; <code class="inline">list.sort()</code> in place (returns None!)</li></ul>
<h3>Classic pattern: sort then sweep</h3>
<pre><span class="c"># merge intervals (Medium ⭐ — memorize)</span>
ints.sort()
merged = [ints[<span class="n">0</span>]]
<span class="k">for</span> s, e <span class="k">in</span> ints[<span class="n">1</span>:]:
    <span class="k">if</span> s &lt;= merged[-<span class="n">1</span>][<span class="n">1</span>]:
        merged[-<span class="n">1</span>][<span class="n">1</span>] = <span class="k">max</span>(merged[-<span class="n">1</span>][<span class="n">1</span>], e)
    <span class="k">else</span>:
        merged.append([s, e])</pre>
<div class="practice"><b>🎯 Practice:</b> <code class="inline">merge-intervals</code> ⭐, <code class="inline">sort-colors</code>, <code class="inline">largest-number</code> (Medium, custom comparator). From <b>Sorting</b> folders.</div>`},

/* ============ PHASE 3: CORE STRUCTURES ============ */
{phase:"PHASE 3 — CORE DATA STRUCTURES", title:"Lesson 18 — Stacks & Queues", body:`
<h3>Stack — LIFO (last in, first out). Just a list:</h3>
<pre>stack = []
stack.append(x)   <span class="c"># push</span>
stack.pop()       <span class="c"># pop top</span>
stack[-<span class="n">1</span>]         <span class="c"># peek</span></pre>
<h3>Queue — FIFO. Use deque (lists are O(n) at the front!)</h3>
<pre><span class="k">from</span> collections <span class="k">import</span> deque
q = deque()
q.append(x)       <span class="c"># enqueue</span>
q.popleft()       <span class="c"># dequeue — O(1)</span></pre>
<h3>⭐ Monotonic stack — the pattern behind 50+ Medium/Hards</h3>
<pre><span class="c"># next greater element for each item — O(n)</span>
stack = []                  <span class="c"># indices, values decreasing</span>
res = [-<span class="n">1</span>] * <span class="k">len</span>(nums)
<span class="k">for</span> i <span class="k">in</span> <span class="k">range</span>(<span class="k">len</span>(nums)):
    <span class="k">while</span> stack <span class="k">and</span> nums[stack[-<span class="n">1</span>]] &lt; nums[i]:
        res[stack.pop()] = nums[i]
    stack.append(i)</pre>
<div class="tip">💡 Triggers: matching brackets / undo / "nearest smaller-greater" / histogram areas → stack. BFS scheduling / streaming first-unique → queue.</div>
<div class="practice"><b>🎯 Practice:</b> <code class="inline">valid-parentheses</code> (now it clicks!), <code class="inline">implement-queue-using-stacks</code>, <code class="inline">daily-temperatures</code> (Medium ⭐ monotonic stack), <code class="inline">min-stack</code>.</div>`},

{title:"Lesson 19 — Linked Lists", body:`
<p>Nodes chained by pointers. In Python you build them by hand — great pointer-practice:</p>
<pre><span class="k">class</span> ListNode:
    <span class="k">def</span> __init__(self, val=<span class="n">0</span>, next=<span class="k">None</span>):
        self.val = val
        self.next = next

head = ListNode(<span class="n">1</span>, ListNode(<span class="n">2</span>, ListNode(<span class="n">3</span>)))</pre>
<h3>The universal traversal</h3>
<pre>cur = head
<span class="k">while</span> cur:
    <span class="k">print</span>(cur.val)
    cur = cur.next</pre>
<h3>Trick 1: Dummy head (removes edge cases!)</h3>
<pre>dummy = ListNode(<span class="n">0</span>, head)
tail = dummy
<span class="c"># ... build onto tail ...
<span class="k">return</span> dummy.next   <span class="c"># real head</span></pre>
<h3>Trick 2: Fast & slow pointers</h3>
<pre><span class="c"># middle node & cycle detection — Floyd's</span>
slow = fast = head
<span class="k">while</span> fast <span class="k">and</span> fast.next:
    slow = slow.next
    fast = fast.next.next
<span class="c"># slow = middle; if they meet → cycle exists</span></pre>
<h3>Trick 3: Reverse a list in place (MEMORIZE VERBATIM)</h3>
<pre>prev = <span class="k">None</span>
<span class="k">while</span> cur:
    nxt = cur.next
    cur.next = prev
    prev = cur
    cur = nxt
<span class="k">return</span> prev</pre>
<div class="practice"><b>🎯 Practice:</b> <code class="inline">reverse-linked-list</code> ⭐, <code class="inline">merge-two-sorted-lists</code> ⭐, <code class="inline">linked-list-cycle</code>, <code class="inline">middle-of-the-linked-list</code> — all Easy, all classics. From <b>Linked List/Easy</b>.</div>`},

{title:"Lesson 20 — Trees & DFS/BFS on Trees", body:`
<pre><span class="k">class</span> TreeNode:
    <span class="k">def</span> __init__(self, val=<span class="n">0</span>, left=<span class="k">None</span>, right=<span class="k">None</span>):
        self.val, self.left, self.right = val, left, right</pre>
<h3>DFS — recursion is natural here</h3>
<pre><span class="c"># the 3 lines of tree recursion you'll reuse FOREVER</span>
<span class="k">def</span> dfs(node):
    <span class="k">if</span> <span class="k">not</span> node: <span class="k">return</span> <span class="n">0</span>            <span class="c"># base: null node</span>
    L, R = dfs(node.left), dfs(node.right)
    <span class="k">return</span> <span class="c"># combine L, R, node.val</span></pre>
<pre><span class="c"># max depth — the hello-world of trees</span>
<span class="k">def</span> maxDepth(root):
    <span class="k">if</span> <span class="k">not</span> root: <span class="k">return</span> <span class="n">0</span>
    <span class="k">return</span> <span class="n">1</span> + <span class="k">max</span>(maxDepth(root.left), maxDepth(root.right))</pre>
<h3>BFS — level by level (deque again!)</h3>
<pre><span class="k">from</span> collections <span class="k">import</span> deque
<span class="k">def</span> level_order(root):
    <span class="k">if</span> <span class="k">not</span> root: <span class="k">return</span> []
    q, out = deque([root]), []
    <span class="k">while</span> q:
        level = []
        <span class="k">for</span> _ <span class="k">in</span> <span class="k">range</span>(<span class="k">len</span>(q)):    <span class="c"># snapshot = one level</span>
            node = q.popleft()
            level.append(node.val)
            <span class="k">if</span> node.left: q.append(node.left)
            <span class="k">if</span> node.right: q.append(node.right)
        out.append(level)
    <span class="k">return</span> out</pre>
<h3>Traversals (know all four)</h3>
<table><tr><th>Order</th><th>Visit</th><th>Note</th></tr>
<tr><td>In-order</td><td>L, root, R</td><td>BST → sorted output!</td></tr>
<tr><td>Pre-order</td><td>root, L, R</td><td>copy/serialize trees</td></tr>
<tr><td>Post-order</td><td>L, R, root</td><td>delete/children-first</td></tr>
<tr><td>Level-order</td><td>BFS</td><td>shortest depth, per-level</td></tr></table>
<div class="practice"><b>🎯 Practice:</b> <code class="inline">maximum-depth-of-binary-tree</code>, <code class="inline">invert-binary-tree</code> ⭐, <code class="inline">same-tree</code>, <code class="inline">symmetric-tree</code>, <code class="inline">binary-tree-level-order-traversal</code> (Medium). From <b>Tree</b>/<b>Binary Tree</b> folders.</div>`},

{title:"Lesson 21 — Binary Search Trees & Heaps", body:`
<h3>BST invariant: left &lt; node &lt; right (everywhere)</h3>
<pre><span class="k">def</span> insert(node, val):
    <span class="k">if</span> <span class="k">not</span> node: <span class="k">return</span> TreeNode(val)
    <span class="k">if</span> val &lt; node.val: node.left = insert(node.left, val)
    <span class="k">else</span>: node.right = insert(node.right, val)
    <span class="k">return</span> node</pre>
<p>Search/insert/delete: O(h). Balanced → O(log n). Skewed → O(n). In-order traversal = sorted list.</p>
<h3>Heaps — "give me the smallest/biggest" in O(log n)</h3>
<pre><span class="k">import</span> heapq
heap = []
heapq.heappush(heap, <span class="n">3</span>)     <span class="c"># MIN-heap by default!</span>
smallest = heapq.heappop(heap)
heapq.heapify(nums)          <span class="c"># turn list into heap, O(n)</span>

<span class="c"># max-heap trick: negate values</span>
heapq.heappush(heap, -val); biggest = -heapq.heappop(heap)</pre>
<h3>Top-K pattern (asked CONSTANTLY)</h3>
<pre><span class="c"># k most frequent elements</span>
counts = Counter(nums)
<span class="k">return</span> [x <span class="k">for</span> x,_ <span class="k">in</span> heapq.nlargest(k, counts.items(), key=<span class="k">lambda</span> kv: kv[<span class="n">1</span>])]
<span class="c"># or keep a size-k min-heap → O(n log k) instead of full sort</span></pre>
<div class="tip">💡 Triggers: "k largest/smallest/closest/most frequent" → heap of size k. "median of stream" → two heaps (one max, one min).</div>
<div class="practice"><b>🎯 Practice:</b> <code class="inline">validate-binary-search-tree</code> (Medium ⭐), <code class="inline">kth-largest-element-in-a-stream</code>, <code class="inline">top-k-frequent-elements</code> (Medium ⭐), <code class="inline">last-stone-weight</code>.</div>`},

{title:"Lesson 22 — Graphs: DFS, BFS, Topological Sort", body:`
<p>Graphs in Python: adjacency list via dict — build this reflexively.</p>
<pre><span class="k">from</span> collections <span class="k">import</span> defaultdict
graph = defaultdict(<span class="k">list</span>)
<span class="k">for</span> u, v <span class="k">in</span> edges:
    graph[u].append(v)
    graph[v].append(u)      <span class="c"># undirected only</span></pre>
<h3>DFS (recursive + visited set)</h3>
<pre>visited = set()
<span class="k">def</span> dfs(node):
    visited.add(node)
    <span class="k">for</span> nb <span class="k">in</span> graph[node]:
        <span class="k">if</span> nb <span class="k">not</span> <span class="k">in</span> visited:
            dfs(nb)</pre>
<h3>BFS = shortest path in unweighted graphs</h3>
<pre><span class="k">def</span> bfs(start):
    q = deque([(start, <span class="n">0</span>)])
    visited = {start}
    <span class="k">while</span> q:
        node, dist = q.popleft()
        <span class="k">for</span> nb <span class="k">in</span> graph[node]:
            <span class="k">if</span> nb <span class="k">not</span> <span class="k">in</span> visited:
                visited.add(nb)
                q.append((nb, dist + <span class="n">1</span>))</pre>
<h3>Grid problems = graph problems (memorize the neighbor loop)</h3>
<pre>dirs = [(<span class="n">1</span>,<span class="n">0</span>),(-<span class="n">1</span>,<span class="n">0</span>),(<span class="n">0</span>,<span class="n">1</span>),(<span class="n">0</span>,-<span class="n">1</span>)]
<span class="k">for</span> dr, dc <span class="k">in</span> dirs:
    nr, nc = r + dr, c + dc
    <span class="k">if</span> <span class="n">0</span> &lt;= nr &lt; rows <span class="k">and</span> <span class="n">0</span> &lt;= nc &lt; cols: ...</pre>
<h3>Topological sort (DAG ordering — course schedule!)</h3>
<pre><span class="c"># Kahn's: repeatedly take nodes with no remaining prerequisites</span>
indeg = defaultdict(<span class="k">int</span>)
q = deque([n <span class="k">for</span> n <span class="k">in</span> nodes <span class="k">if</span> indeg[n] == <span class="n">0</span>])
order = []
<span class="k">while</span> q:
    u = q.popleft(); order.append(u)
    <span class="k">for</span> v <span class="k">in</span> graph[u]:
        indeg[v] -= <span class="n">1</span>
        <span class="k">if</span> indeg[v] == <span class="n">0</span>: q.append(v)</pre>
<div class="practice"><b>🎯 Practice:</b> <code class="inline">number-of-islands</code> ⭐⭐ (THE graph starter), <code class="inline">flood-fill</code>, <code class="inline">rotting-oranges</code> (BFS ⭐), <code class="inline">course-schedule</code> (topo sort ⭐), <code class="inline">clone-graph</code>. From <b>Graph Theory</b>, <b>Matrix</b>, <b>BFS/DFS</b> folders.</div>`},

{title:"Lesson 23 — Union-Find (Disjoint Set)", body:`
<p>Answers "are these connected?" near-instantly. Powers Kruskal's MST, network connectivity, accounts merge.</p>
<pre><span class="k">class</span> DSU:
    <span class="k">def</span> __init__(self, n):
        self.parent = <span class="k">list</span>(<span class="k">range</span>(n))

    <span class="k">def</span> find(self, x):
        <span class="k">while</span> self.parent[x] != x:
            self.parent[x] = self.parent[self.parent[x]]  <span class="c"># path compression</span>
            x = self.parent[x]
        <span class="k">return</span> x

    <span class="k">def</span> union(self, a, b):
        ra, rb = self.find(a), self.find(b)
        <span class="k">if</span> ra != rb:
            self.parent[rb] = ra</pre>
<p>With path compression (+ union by rank), operations are near-O(1). Pattern trigger: "connect components", "number of provinces", redundant connections.</p>
<div class="practice"><b>🎯 Practice:</b> <code class="inline">number-of-provinces</code>, <code class="inline">redundant-connection</code>, <code class="inline">accounts-merge</code> (Medium ⭐). Solve <code class="inline">number-of-islands</code> AGAIN with DSU to compare approaches.</div>`},

/* ============ PHASE 4: ADVANCED ============ */
{phase:"PHASE 4 — ADVANCED ALGORITHMS", title:"Lesson 24 — Backtracking (Explore Everything)", body:`
<p>Backtracking = DFS over decisions: choose → recurse → unchoose. It enumerates candidates smartly.</p>
<pre><span class="k">def</span> backtrack(path, choices):
    <span class="k">if</span> goal_reached(path):
        results.append(path[:])   <span class="c"># COPY the path!</span>
        <span class="k">return</span>
    <span class="k">for</span> c <span class="k">in</span> choices:
        <span class="k">if</span> valid(c):
            path.append(c)        <span class="c"># choose</span>
            backtrack(path, ...)  <span class="c"># explore</span>
            path.pop()            <span class="c"># UNCHOOSE ← the essence</span></pre>
<pre><span class="c"># subsets — every element: in or out</span>
<span class="k">def</span> subsets(nums):
    res, path = [], []
    <span class="k">def</span> dfs(i):
        <span class="k">if</span> i == <span class="k">len</span>(nums):
            res.append(path[:]); <span class="k">return</span>
        path.append(nums[i]); dfs(i+<span class="n">1</span>)   <span class="c"># take it</span>
        path.pop();             dfs(i+<span class="n">1</span>)   <span class="c"># leave it</span>
    dfs(<span class="n">0</span>)
    <span class="k">return</span> res</pre>
<div class="tip">💡 Family: subsets / permutations / combinations / N-Queens / Sudoku / word search. All identical skeleton, different goal test & choice filter. Pruning (skip invalid branches early) is what separates good answers.</div>
<div class="practice"><b>🎯 Practice:</b> <code class="inline">subsets</code> ⭐, <code class="inline">permutations</code> ⭐, <code class="inline">combination-sum</code>, <code class="inline">word-search</code>, then <code class="inline">n-queens</code> (Hard badge unlocked 🏅). From <b>Backtracking</b> folders.</div>`},

{title:"Lesson 25 — Greedy Algorithms", body:`
<p>Greedy: make the locally-best choice, never reconsider. Works ONLY when local optimum ⇒ global optimum — proving that is the hard/interview part.</p>
<pre><span class="c"># activity selection: max non-overlapping intervals</span>
<span class="c"># greedy insight: earliest ENDING interval leaves most room</span>
ints.sort(key=<span class="k">lambda</span> iv: iv[<span class="n">1</span>])
count, end = <span class="n">0</span>, -inf
<span class="k">for</span> s, e <span class="k">in</span> ints:
    <span class="k">if</span> s &gt;= end:
        count += <span class="n">1</span>; end = e</pre>
<pre><span class="c"># jump game: furthest reachable</span>
reach = <span class="n">0</span>
<span class="k">for</span> i, j <span class="k">in</span> <span class="k">enumerate</span>(nums):
    <span class="k">if</span> i &gt; reach: <span class="k">return</span> <span class="k">False</span>
    reach = <span class="k">max</span>(reach, i + j)</pre>
<div class="tip">💡 Greedy vs DP: if a choice now can't hurt later → greedy (faster). If choices interact → DP. Test both mentally when unsure.</div>
<div class="practice"><b>🎯 Practice:</b> <code class="inline">jump-game</code> ⭐, <code class="inline">assign-cookies</code>, <code class="inline">maximum-subarray</code> (greedy view!), <code class="inline">non-overlapping-intervals</code> (Medium ⭐). From <b>Greedy</b> folders.</div>`},

{title:"Lesson 26 — Dynamic Programming I: The Mindset", body:`
<p>DP = recursion + remembering. Overlapping subproblems + optimal substructure = cache the answers.</p>
<h3>Step recipe (use EVERY time)</h3>
<ol><li>Define state: <code class="inline">dp[i] = best answer for first i items / ending at i</code></li>
<li>Find recurrence: how dp[i] builds from smaller states</li>
<li>Base cases</li><li>Iteration order (small → large)</li><li>Answer location</li></ol>
<pre><span class="c"># climbing stairs: ways to reach step n (1 or 2 at a time)</span>
dp = [<span class="n">0</span>] * (n+<span class="n">1</span>)
dp[<span class="n">0</span>] = dp[<span class="n">1</span>] = <span class="n">1</span>
<span class="k">for</span> i <span class="k">in</span> <span class="k">range</span>(<span class="n">2</span>, n+<span class="n">1</span>):
    dp[i] = dp[i-<span class="n">1</span>] + dp[i-<span class="n">2</span>]   <span class="c"># came from i-1 or i-2</span></pre>
<h3>Two implementation styles</h3>
<pre><span class="c"># Top-down: recursion + memo (feels like Lesson 11!)</span>
<span class="k">from</span> functools <span class="k">import</span> lru_cache
<span class="n">@lru_cache</span>(maxsize=<span class="k">None</span>)
<span class="k">def</span> solve(i): ...

<span class="c"># Bottom-up: table loop (usually faster, less stack risk)</span></pre>
<pre><span class="c"># house robber — dp[i] = max loot ending here</span>
rob, skip = <span class="n">0</span>, <span class="n">0</span>
<span class="k">for</span> x <span class="k">in</span> nums:
    rob, skip = skip + x, <span class="k">max</span>(rob, skip)  <span class="c"># rolling vars: O(1) space!</span></pre>
<div class="tip">💡 Space optimization is standard: if dp[i] needs only the last k values, keep k rolling variables. Interviewers love hearing "we can reduce to O(1) space."</div>
<div class="practice"><b>🎯 Practice:</b> <code class="inline">climbing-stairs</code> ⭐, <code class="inline">house-robber</code> ⭐, <code class="inline">coin-change</code> (Medium ⭐⭐ — the gateway DP), <code class="inline">min-cost-climbing-stairs</code>. From <b>Dynamic Programming</b> folders.</div>`},

{title:"Lesson 27 — Dynamic Programming II: The Patterns", body:`
<p>All of DP is ~10 patterns. Master these five first:</p>
<h3>1. 0/1 Knapsack (take or skip)</h3>
<pre><span class="c"># partition equal subset sum</span>
dp = {<span class="n">0</span>}                        <span class="c"># achievable sums</span>
<span class="k">for</span> x <span class="k">in</span> nums:
    dp |= {s + x <span class="k">for</span> s <span class="k">in</span> dp}
<span class="c"># target in dp?</span></pre>
<h3>2. LIS — longest increasing subsequence O(n log n)</h3>
<pre><span class="k">import</span> bisect
tails = []
<span class="k">for</span> x <span class="k">in</span> nums:
    i = bisect.bisect_left(tails, x)
    <span class="k">if</span> i == <span class="k">len</span>(tails): tails.append(x)
    <span class="k">else</span>: tails[i] = x
<span class="c"># len(tails) = LIS length</span></pre>
<h3>3. Grid DP (paths with obstacles)</h3>
<pre>dp[r][c] = dp[r-<span class="n">1</span>][c] + dp[r][c-<span class="n">1</span>]   <span class="c"># unique paths</span></pre>
<h3>4. String DP (edit distance family)</h3>
<pre><span class="c"># LCS: longest common subsequence</span>
<span class="k">if</span> a[i]==b[j]: dp = <span class="n">1</span>+dp[i-<span class="n">1</span>][j-<span class="n">1</span>]
<span class="k">else</span>: dp = <span class="k">max</span>(dp[i-<span class="n">1</span>][j], dp[i][j-<span class="n">1</span>])</pre>
<h3>5. Interval DP / DP on strings (later — palindromic substrings etc.)</h3>
<div class="practice"><b>🎯 Practice:</b> <code class="inline">partition-equal-subset-sum</code> ⭐, <code class="inline">longest-increasing-subsequence</code> ⭐, <code class="inline">unique-paths</code>, <code class="inline">longest-common-subsequence</code> ⭐ (all Medium). Then reward yourself: <code class="inline">edit-distance</code> (Hard ⭐ — asked at FAANG forever).</div>`},

{title:"Lesson 28 — Tries, Bit Manipulation & Math Toolkit", body:`
<h3>Trie — prefix tree (autocomplete, word games)</h3>
<pre><span class="k">class</span> TrieNode:
    <span class="k">def</span> __init__(self):
        self.children = {}
        self.end = <span class="k">False</span>

root = TrieNode()
<span class="k">for</span> ch <span class="k">in</span> word: root = root.children.setdefault(ch, TrieNode())
root.end = <span class="k">True</span></pre>
<h3>Bits — the interview survival kit</h3>
<pre>x &amp; <span class="n">1</span>          <span class="c"># odd/even check</span>
x &amp; (x-<span class="n">1</span>)      <span class="c"># drop lowest set bit; 0 → power of two</span>
x ^ x == <span class="n">0</span>     <span class="c"># XOR cancels pairs → find-the-single-number!</span>
x &gt;&gt; <span class="n">1</span>, x &lt;&lt; <span class="n">1</span> <span class="c"># halve, double</span>
bin(x).count(<span class="s">"1"</span>)  <span class="c"># popcount</span></pre>
<h3>Math toolkit</h3>
<pre><span class="k">import</span> math
math.gcd(a, b)                     <span class="c"># gcd; lcm = a*b//gcd</span>
<span class="c"># sieve of Eratosthenes for primes up to n</span>
is_p = [<span class="k">True</span>]*(n+<span class="n">1</span>); is_p[<span class="n">0</span>]=is_p[<span class="n">1</span>]=<span class="k">False</span>
<span class="k">for</span> i <span class="k">in</span> <span class="k">range</span>(<span class="n">2</span>, <span class="k">int</span>(n**<span class="n">0.5</span>)+<span class="n">1</span>):
    <span class="k">if</span> is_p[i]: is_p[i*i::<span class="n">2</span>*i] = [<span class="k">False</span>]*(<span class="k">len</span>(<span class="k">range</span>(i*i,n,<span class="n">2</span>*i)))</pre>
<div class="practice"><b>🎯 Practice:</b> <code class="inline">implement-trie</code> ⭐, <code class="inline">single-number</code> (XOR ⭐), <code class="inline">counting-bits</code>, <code class="inline">count-primes</code> (sieve ⭐). From respective topic folders.</div>`},

{title:"Lesson 29 — Mock Interview Strategy & What's Next", body:`
<h3>The interview script (use verbatim)</h3>
<ol><li><b>Restate</b> the problem + confirm constraints & edge cases (empty? negatives? duplicates?)</li>
<li><b>Brute force out loud</b> with complexity — never skip this</li>
<li><b>Optimize:</b> "Can I trade space for time?" (hash map), "Is there order?" (sort/binary search/two pointers), "Repeated subproblems?" (DP/memo)</li>
<li><b>Code</b> while narrating; test with a small example INCLUDING an edge case before saying done</li>
<li><b>State final complexity</b>: time + space + why</li></ol>
<h3>Python one-liners worth knowing cold</h3>
<pre>Counter(s) == Counter(t)                          <span class="c"># anagram check</span>
nums_set = set(nums); <span class="k">len</span>(nums_set) != <span class="k">len</span>(nums)   <span class="c"># duplicates</span>
heapq.nlargest(k, nums)                           <span class="c"># top-k</span>
bisect.bisect_left(sorted_list, x)                <span class="c"># insert point</span></pre>

let current = 0;
const doneKey = "dsa_course_done";
let doneSet = new Set(JSON.parse(localStorage.getItem(doneKey) || "[]"));

function renderList(){
  const el = document.getElementById("lessonlist");
  el.innerHTML = "";
  let phase = "";
  COURSE.forEach((L,i)=>{
    if(L.phase){ const d=document.createElement("div"); d.className="phase"; d.textContent=L.phase; el.appendChild(d); }
    else {
      const a=document.createElement("div");
      a.className="lesson-link"+(i===current?" active":"")+(doneSet.has(i)?" done":"");
      a.textContent=L.title.replace(/^Lesson \d+ — /,"").replace(/—.*/,"");
      a.textContent=L.title;
      a.onclick=()=>{current=i;renderAll();window.scrollTo(0,0)};
      el.appendChild(a);
    }
  });
  updateProgress();
}
function updateProgress(){
  const pct = Math.round(doneSet.size/COURSE.length*100);
  document.getElementById("progressfill").style.width=pct+"%";
  document.getElementById("progresstext").textContent=`${doneSet.size}/${COURSE.length} lessons complete (${pct}%)`;
}
function renderAll(){
  const L=COURSE[current];
  const c=document.getElementById("content");
  c.innerHTML=`<span class="badge">${L.phase||""}</span><h2 class="title">${L.title}</h2>${L.body}
  <div id="navbtns">
    <button class="nav donebtn" onclick="toggleDone()">✓ ${doneSet.has(current)?"Done (unmark)":"Mark complete"}</button>
    ${current>0?'<button class="nav" onclick="current--;renderAll()">← Previous</button>':""}
    ${current<COURSE.length-1?'<button class="nav" onclick="current++;renderAll()">Next →</button>':""}
  </div>`;
  renderList();
}
function toggleDone(){
  doneSet.has(current)?doneSet.delete(current):doneSet.add(current);
  localStorage.setItem(doneKey,JSON.stringify([...doneSet]));
  renderAll();
}
renderAll();
</script>
